name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install quality dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Security scan
        run: bandit -q -c pyproject.toml -r src

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.10"}
          - {os: macos-latest, python-version: "3.14"}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Build and inspect distributions
        run: python -m pip install --upgrade pip build twine && python -m build && python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifact
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install wheel only
        run: python -c "import glob,subprocess,sys; wheels=glob.glob('artifact/*.whl'); len(wheels)==1 or sys.exit(f'expected one wheel, found {wheels}'); subprocess.check_call([sys.executable,'-m','pip','install',wheels[0]])"
      - name: Smoke-test installed package
        run: python -I -c "import turnscope; raise SystemExit(0 if turnscope.__version__ == '0.2.0' else f'unexpected version {turnscope.__version__}')" && turnscope --version

  neural-installed:
    name: Installed CPU neural workflow (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Download distributions without checking out source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: artifact
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install wheel, tests and explicit CPU training runtime
        shell: python
        run: |
          import glob, subprocess, sys
          wheels = glob.glob('artifact/*.whl')
          if len(wheels) != 1:
              raise RuntimeError('expected exactly one built wheel')
          subprocess.run([sys.executable, '-m', 'pip', 'install', wheels[0],
                          'numpy==1.26.4', 'pytest>=8.3', 'pytest-cov>=5'], check=True)
          command = [sys.executable, '-m', 'pip', 'install', 'torch==2.10.0']
          if sys.platform != 'darwin':
              command += ['--index-url', 'https://download.pytorch.org/whl/cpu']
          subprocess.run(command, check=True)
      - name: Verify raw wheel sources and extract bounded test helpers only
        shell: python
        run: |
          import hashlib, json, stat, tarfile, zipfile
          from pathlib import Path, PurePosixPath
          import turnscope
          def sha(raw):
              return hashlib.sha256(raw).hexdigest()
          wheels, sdists = list(Path('artifact').glob('*.whl')), list(Path('artifact').glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              raise RuntimeError('expected one wheel and one source distribution')
          installed = Path(turnscope.__file__).resolve().parent
          with zipfile.ZipFile(wheels[0]) as archive:
              runtime = {'src/' + name: archive.read(name) for name in archive.namelist()
                         if name.startswith('turnscope/') and (name.endswith('.py') or name.endswith('/py.typed'))}
          if not runtime or 'src/turnscope/py.typed' not in runtime:
              raise RuntimeError('wheel has no closed runtime inventory')
          for name, raw in runtime.items():
              if (installed / name.removeprefix('src/turnscope/')).read_bytes() != raw:
                  raise RuntimeError('installed runtime differs from wheel: ' + name)
          destination = Path('installed-test')
          destination.mkdir()
          bindings, seen, sources, prefixes, total = {}, set(), set(), set(), 0
          with tarfile.open(sdists[0], 'r:gz') as archive:
              for member in archive:
                  parts = PurePosixPath(member.name).parts
                  if (not parts or PurePosixPath(member.name).is_absolute() or
                      any(part in ('.', '..') or ':' in part or '\\' in part for part in parts)):
                      raise RuntimeError('unsafe source member name')
                  prefixes.add(parts[0])
                  if len(prefixes) != 1 or member.name in seen or len(seen) >= 2000:
                      raise RuntimeError('duplicate, excessive or multiple-root source members')
                  seen.add(member.name)
                  if member.isdir():
                      continue
                  if not member.isfile() or member.size > 32 * 1024 * 1024:
                      raise RuntimeError('source member is not a bounded regular file')
                  total += member.size
                  if total > 128 * 1024 * 1024:
                      raise RuntimeError('source distribution exceeds helper admission budget')
                  name = '/'.join(parts[1:])
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise RuntimeError('missing source payload')
                  raw = stream.read(member.size + 1)
                  if len(raw) != member.size:
                      raise RuntimeError('source member size mismatch')
                  if name.startswith('src/turnscope/'):
                      if name not in runtime or raw != runtime[name]:
                          raise RuntimeError('source runtime differs from wheel: ' + name)
                      sources.add(name)
                  elif name.startswith(('tests/', 'benchmarks/', 'examples/', 'docs/')) or name == 'pyproject.toml':
                      target = destination.joinpath(*parts[1:])
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open('xb') as output:
                          output.write(raw)
                  bindings[name] = sha(raw)
          if sources != runtime.keys():
              raise RuntimeError('wheel/source runtime inventories differ')
          if (destination / 'src').exists():
              raise RuntimeError('tests must not import an extracted source checkout')
          Path('neural-evidence').mkdir()
          report = {'format': 'turnscope.neural-distribution-binding.v1',
                    'wheel_sha256': sha(wheels[0].read_bytes()), 'sdist_sha256': sha(sdists[0].read_bytes()),
                    'runtime_sha256': {name: sha(raw) for name, raw in runtime.items()},
                    'sdist_source_sha256': bindings, 'installed_runtime_verified': True}
          Path('neural-evidence/distribution.json').write_text(json.dumps(report, sort_keys=True) + '\n', encoding='utf-8')
      - name: Test the installed package with actual CPU training
        run: python -I -m pytest installed-test/tests --junitxml=neural-evidence/tests.xml --cov=turnscope --cov-config=installed-test/pyproject.toml --cov-report=json:neural-evidence/coverage.json --cov-report=term --cov-fail-under=90
      - name: Train and deploy the shipped demonstration without Torch at inference
        run: python -I -X utf8 installed-test/examples/neural_forecast_demo.py private-neural-demo
      - name: Verify demonstration source bindings and unchanged installed package
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          import turnscope
          binding = json.loads(Path('neural-evidence/distribution.json').read_text(encoding='utf-8'))
          report = json.loads(Path('private-neural-demo/demo-report.json').read_text(encoding='utf-8'))
          expected = dict(binding['runtime_sha256'])
          expected['examples/neural_forecast_demo.py'] = binding['sdist_source_sha256']['examples/neural_forecast_demo.py']
          if report['source_sha256'] != expected or report['completed'] is not True:
              raise RuntimeError('actual demonstration source bindings differ')
          installed = Path(turnscope.__file__).resolve().parent
          for name, digest in binding['runtime_sha256'].items():
              raw = (installed / name.removeprefix('src/turnscope/')).read_bytes()
              if hashlib.sha256(raw).hexdigest() != digest:
                  raise RuntimeError('installed source changed during verification')
          if report['frozen_commands_with_torch_forbidden'] != ['inspect', 'predict', 'evaluate']:
              raise RuntimeError('frozen deployment commands were not all verified')
          Path('neural-evidence/demo-report.json').write_bytes(Path('private-neural-demo/demo-report.json').read_bytes())
      # Failed test diagnostics may include authored fixture strings or parameters.
      # Model bundles and generated input files are never selected by this glob.
      - name: Upload test summaries and aggregate demo evidence; exclude model/input files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neural-evidence-${{ matrix.os }}
          path: neural-evidence/*
          if-no-files-found: error
          retention-days: 7
